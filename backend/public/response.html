<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafePath - Emergency Response Center</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="/response_v2.css">
</head>
<body class="light-theme">
  <header class="response-header">
    <div class="header-left">
      <p class="eyebrow">Active Response</p>
      <h1>Emergency Response Center</h1>
    </div>
    <div class="header-right">
        <div class="live-indicator">
            <span class="pulse-dot"></span> System Live
        </div>
        <nav class="breadcrumb">
          <a href="/index.html" class="back-link">← Command Center</a>
        </nav>
    </div>
  </header>

  <main class="response-main">
    <div class="main-grid">
      <!-- Focus Area -->
      <section class="focus-section">
        <div id="no-active-sos" class="empty-state">
          <div class="empty-icon">🛡️</div>
          <h2>System Standing By</h2>
          <p>No critical emergency signals detected at this time.</p>
        </div>

        <div id="focus-card" class="sos-focus-card" style="display: none;">
          <div id="sos-map" class="map-view"></div>
          
          <div class="sos-content">
            <div class="badges">
              <span class="badge badge-emergency">CRITICAL SOS</span>
              <span class="badge badge-source" id="sos-source">USER</span>
            </div>

            <h2 id="sos-title">SOS Signal Detected</h2>
            <p id="sos-coords" class="coords">📍 22.71960, 75.85770</p>
            
            <div class="info-grid">
              <div class="info-item">
                <span class="label">Triggered At</span>
                <span class="value" id="stat-updated">--:--</span>
              </div>
              <div class="info-item">
                <span class="label">Responder Load</span>
                <span class="value" id="stat-routed">0 Active</span>
              </div>
            </div>

            <div class="action-bar">
              <button class="btn btn-outline" onclick="alert('Lockdown protocol initiated.')">🔒 Lockdown</button>
              <button class="btn btn-success" id="resolve-btn">✓ Mark Resolved</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Responders Area -->
      <section class="responders-section">
        <div class="section-header">
          <h2>Responder Dispatch</h2>
          <button class="btn btn-danger" id="broadcast-all-btn">📢 Broadcast All</button>
        </div>
        
        <div id="responder-list" class="responder-list">
          <!-- Dynamic -->
        </div>
      </section>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/response_v2.js"></script>
</body>
</html>
